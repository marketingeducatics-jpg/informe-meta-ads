<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Informe Meta Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root {
  --bg: #f4f6f8; --surface: #ffffff; --fg: #141a22; --fg-2: #4b5563; --muted: #7b8494;
  --line: #e2e6ec; --axis: #c4cad4; --accent: #1f5fa8; --series-1: #2a78d6; --series-2: #eb6834;
  --prev: #b9c2cf; --good: #0ca30c; --good-text: #006300; --warn: #fab219; --warn-text: #8a5a00; --crit: #d03b3b; --crit-text: #a32a2a; --marker: #eb6834;
  --display: "Figtree", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --surface: #181c22; --fg: #f3f4f6; --fg-2: #c3c7cf; --muted: #8b93a1;
    --line: #2a2f37; --axis: #3a404a; --accent: #5a9ae6; --series-1: #3987e5; --series-2: #d95926;
    --prev: #4a5261; --good-text: #3fc53f; --warn-text: #f5c04a; --crit: #e05555; --crit-text: #f08080; --marker: #ff8a5b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 28px; }
#report { display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 4.5vw, 42px); font-weight: 800; line-height: 1.1; }
h2 { font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; max-width: 68ch; }
[hidden] { display: none !important; }
.eyebrow { font-family: var(--display); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.lede { color: var(--fg-2); font-size: 18px; max-width: 64ch; }
header { display: grid; gap: 12px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 14px; }
section { display: grid; gap: 18px; }
.section-head { display: grid; gap: 6px; }
.section-head p { color: var(--fg-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; display: grid; gap: 14px; }
.gate { max-width: 420px; margin: 12vh auto 0; }
.gate p { color: var(--fg-2); }
label { font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--fg-2); display: grid; gap: 4px; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--axis); border-radius: 8px; padding: 9px 11px; min-width: 0; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: var(--display); font-weight: 600; font-size: 15px; border-radius: 8px; padding: 10px 16px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); border-color: var(--axis); }
button:disabled { opacity: .6; cursor: progress; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.toolbar .status { flex: 1 1 200px; color: var(--muted); font-size: 14px; text-align: right; }
.error { color: var(--crit-text); font-size: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 4px; min-width: 0; }
.kpi .label { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--display); }
.kpi .value { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 14px; color: var(--fg-2); }
.delta { font-family: var(--display); font-weight: 600; font-size: 13px; }
.delta.up { color: var(--good-text); } .delta.down { color: var(--crit-text); } .delta.flat { color: var(--muted); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
.grid-2 > * { min-width: 0; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.chart-title { font-family: var(--display); font-weight: 600; font-size: 15px; }
.chart-sub { font-size: 13px; color: var(--muted); }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font-family: var(--body); fill: var(--fg-2); font-size: 12px; font-variant-numeric: tabular-nums; }
svg .axis-label { fill: var(--muted); }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .baseline { stroke: var(--axis); stroke-width: 1; }
svg .bar { fill: var(--series-1); }
svg .bar.prev { fill: var(--prev); }
svg .bar.partial { fill: var(--series-1); opacity: 0.4; }
svg .bar-label { fill: var(--fg); font-weight: 600; }
svg .marker { stroke: var(--marker); stroke-width: 2; }
svg .marker-text { fill: var(--marker); font-weight: 600; font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--fg-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.s1 { background: var(--series-1); } .sw.prev { background: var(--prev); } .sw.part { background: var(--series-1); opacity: .4; }
.sw.mk { width: 3px; height: 14px; border-radius: 1px; background: var(--marker); }
.action { gap: 16px; }
.action-head { display: grid; gap: 4px; }
.action-head .who { color: var(--muted); font-size: 14px; }
.badge { display: inline-block; font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-right: 8px; vertical-align: middle; }
.badge.new, .badge.on { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good-text); }
.badge.edit, .badge.audience { background: color-mix(in srgb, var(--series-1) 16%, transparent); color: var(--accent); }
.badge.budget { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn-text); }
.badge.off { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit-text); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; border-left: 2px solid var(--line); }
.timeline li { display: grid; grid-template-columns: 104px 1fr; gap: 10px; padding-left: 14px; position: relative; font-size: 15px; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--series-1); border: 2px solid var(--surface); }
.timeline li.off::before { background: var(--crit); }
.timeline li.new::before, .timeline li.on::before { background: var(--good); }
.timeline li.budget::before { background: var(--warn); }
.timeline .when { font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--fg-2); padding-top: 2px; white-space: nowrap; }
.timeline .what small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.reading { background: color-mix(in srgb, var(--bg) 70%, var(--surface)); border-radius: 8px; padding: 12px 14px; font-size: 15px; display: grid; gap: 6px; }
section > .reading { background: var(--surface); border: 1px solid var(--line); }
.reading strong { font-family: var(--display); font-weight: 700; }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini-stats div { display: grid; gap: 2px; }
.mini-stats .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--display); font-weight: 600; }
.mini-stats .v { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.bar-table th { text-align: left; font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.bar-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.bar-table td.num, .bar-table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-table .name { min-width: 180px; }
.bar-cell { min-width: 110px; }
.bar-fill { height: 14px; background: var(--series-1); border-radius: 0 4px 4px 0; }
.bar-fill.flag { background: var(--series-2); }
.bar-fill.off { background: var(--prev); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; font-family: var(--display); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.good .dot { background: var(--good); } .chip.mid .dot { background: var(--warn); } .chip.high .dot { background: var(--crit); }
.table-scroll { overflow-x: auto; }
.tag { display: inline-block; font-size: 11px; font-family: var(--display); font-weight: 600; color: var(--muted); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
.tag.edit { color: var(--accent); } .tag.off { color: var(--crit-text); }
.prevcpl { color: var(--muted); font-size: 13px; }
.opps { list-style: none; margin: 0; padding: 0; display: grid; }
.opps li { display: grid; grid-template-columns: 120px 1fr; gap: 6px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.opps li:first-child { padding-top: 0; }
.opps li:last-child { border-bottom: 0; padding-bottom: 0; }
.opps .body { display: grid; gap: 4px; min-width: 0; }
.opps .body strong { font-family: var(--display); }
.opps .todo { color: var(--fg-2); font-size: 15px; }
.opps .todo b { font-family: var(--display); font-weight: 600; color: var(--fg); }
.takeaways ul { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
.takeaways strong { font-family: var(--display); }
.note { font-size: 14px; color: var(--muted); display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 16px; }
.note ul { margin: 0; padding-left: 18px; }
.pieces-block { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 45%), 1fr)); gap: 14px; }
.piece { margin: 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
.piece img, .piece .noimg { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; border-radius: 8px; border: 1px solid var(--line); display: block; background: #0f1216; }
.piece .noimg { display: grid; place-items: center; color: #8b93a1; font-size: 13px; }
.piece figcaption { display: grid; gap: 1px; font-size: 13px; color: var(--fg-2); overflow-wrap: anywhere; }
.piece .st { font-family: var(--display); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.piece .st.off { color: var(--crit-text); } .piece .st.new { color: var(--good-text); } .piece .st.edit { color: var(--accent); }
.piece a { color: var(--accent); }
@media (max-width: 560px) { .timeline li, .opps li { grid-template-columns: 1fr; gap: 2px; } .mini-stats .v { font-size: 19px; } .toolbar .status { text-align: left; } }
@media print { .toolbar, .gate { display: none !important; } body { background: #fff; } .card, .kpi { break-inside: avoid; } }
</style>
</head>
<body>
<div class="wrap">
  <form id="gate" class="card gate" autocomplete="off">
    <h2>Informe Meta Ads</h2>
    <p>Escribe la clave del informe para ver los datos.</p>
    <label>Clave<input id="key" type="password" required autocomplete="current-password"></label>
    <div id="gate-error" class="error" role="alert"></div>
    <button type="submit">Entrar</button>
  </form>

  <div id="app" hidden>
    <form id="toolbar" class="card toolbar">
      <label>Desde<input id="since" type="date" required></label>
      <label>Hasta<input id="until" type="date" required></label>
      <button type="submit" id="go">Ver período</button>
      <button type="button" class="ghost" id="preset">Desde la última reunión</button>
      <button type="button" class="ghost" id="print">Imprimir o PDF</button>
      <div class="status" id="status" role="status"></div>
    </form>
    <div id="report"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var TZ = "America/Guayaquil";
  var WD = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  var WDL = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  var MES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  var BAND = { low: 1.5, mid: 2.5 };
  var key = "";

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function parse(s) { var p = s.split("-"); return new Date(Date.UTC(+p[0], p[1] - 1, +p[2])); }
  function addDays(s, n) { var d = parse(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function todayTZ(tz) { return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
  function dShort(s) { var d = parse(s); return WD[d.getUTCDay()] + " " + d.getUTCDate(); }
  function dLong(s) { var d = parse(s); return WDL[d.getUTCDay()] + " " + d.getUTCDate(); }
  function dFull(s) { var d = parse(s); return d.getUTCDate() + " de " + MES[d.getUTCMonth()]; }
  function num(v, dec) {
    var p = Math.abs(v).toFixed(dec || 0).split(".");
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (v < 0 ? "-" : "") + p.join(",");
  }
  function usd(v, dec) { return "USD " + num(v, dec === undefined ? 2 : dec); }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
  function pct(now, prev) { return prev ? (now - prev) / prev * 100 : null; }
  function pctText(p) { return p === null ? "" : Math.abs(p) < 0.5 ? "igual que" : num(Math.abs(p), 0) + " % " + (p > 0 ? "más que" : "menos que"); }
  function listText(items) { return items.length < 2 ? items.join("") : items.slice(0, -1).join(", ") + " y " + items[items.length - 1]; }
  function parts(iso, tz) {
    var o = {};
    new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date(iso)).forEach(function (p) { o[p.type] = p.value; });
    return { date: o.year + "-" + o.month + "-" + o.day, hm: o.hour + ":" + o.minute, frac: (+o.hour + o.minute / 60) / 24 };
  }
  function shortName(n) { return String(n).replace(/^[\s*\-–]+/, "").replace(/\s*-\s*\d{1,2}[\/\-\s].*$/, "").trim() || String(n); }
  function band(cpl) { return cpl <= BAND.low ? "good" : cpl <= BAND.mid ? "mid" : "high"; }

  function defaultRange(t) {
    var wd = parse(t).getUTCDay();
    var back = wd === 1 ? 4 : wd >= 2 && wd <= 4 ? wd - 1 : wd === 5 ? 1 : wd === 6 ? 2 : 3;
    return { since: addDays(t, -back), until: t };
  }

  /* ---------- gráficos ---------- */
  function barChart(el, o) {
    var vals = o.values.slice(), labels = o.labels.slice(), prevIdx = -1, shift = 0;
    if (o.prev !== undefined && o.prev !== null) { vals.unshift(o.prev); labels.unshift("Ant."); prevIdx = 0; shift = 1; }
    var n = vals.length, W = 460, H = 200, padL = 6, padR = 6, padT = 28, padB = 28;
    var max = Math.max.apply(null, vals.filter(function (v) { return v !== null; }).concat([0])) * 1.15 || 1;
    var plotW = W - padL - padR, plotH = H - padT - padB, slot = plotW / n, bw = Math.min(slot * 0.62, 40);
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.aria || "") + '">';
    for (var g = 1; g <= 3; g++) { var gy = padT + plotH - plotH * g / 3; s += '<line class="grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '"/>'; }
    s += '<line class="baseline" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + (padT + plotH) + '" y2="' + (padT + plotH) + '"/>';
    for (var i = 0; i < n; i++) {
      var cx = padL + slot * i + slot / 2;
      s += '<text class="axis-label" x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(labels[i]) + '</text>';
      if (vals[i] === null) { s += '<text class="axis-label" x="' + cx.toFixed(1) + '" y="' + (padT + plotH - 6) + '" text-anchor="middle">—</text>'; continue; }
      var x = cx - bw / 2, h = Math.max(plotH * vals[i] / max, 4), y = padT + plotH - h, hh = (h - 4).toFixed(1);
      var cls = "bar" + (i === prevIdx ? " prev" : "") + (i - shift === o.partial ? " partial" : "");
      s += '<path class="' + cls + '" d="M' + x.toFixed(1) + ' ' + (padT + plotH) + ' v-' + hh + ' a4 4 0 0 1 4 -4 h' + (bw - 8).toFixed(1) + ' a4 4 0 0 1 4 4 v' + hh + ' z"><title>' + esc(labels[i] + ": " + o.fmt(vals[i])) + '</title></path>';
      if (n <= 12) s += '<text class="bar-label" x="' + cx.toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle">' + esc(o.fmt(vals[i])) + '</text>';
    }
    if (o.marker) {
      var mx = padL + slot * (o.marker.index + shift + o.marker.frac);
      s += '<line class="marker" x1="' + mx.toFixed(1) + '" x2="' + mx.toFixed(1) + '" y1="' + (padT - 4) + '" y2="' + (padT + plotH) + '"/>';
      if (o.marker.label) {
        var right = mx > W * 0.7;
        s += '<text class="marker-text" x="' + (right ? mx - 5 : mx + 5).toFixed(1) + '" y="' + (padT - 8) + '" text-anchor="' + (right ? "end" : "start") + '">' + esc(o.marker.label) + '</text>';
      }
    }
    el.innerHTML = s + '</svg>';
  }

  function dualDay(el, m, row, mk) {
    var a = document.createElement("div"), b = document.createElement("div");
    el.innerHTML = ""; el.style.display = "grid"; el.style.gap = "8px"; el.appendChild(a); el.appendChild(b);
    var cpl = row.l.map(function (v, i) { return v ? row.s[i] / v : null; });
    barChart(a, { values: row.l, labels: m.labels, partial: m.partial, fmt: function (v) { return num(v, 0); }, aria: row.c.name + ", leads por día", marker: mk });
    barChart(b, { values: cpl, labels: m.labels, partial: m.partial, fmt: function (v) { return "$" + num(v, 2); }, aria: row.c.name + ", costo por lead por día", marker: mk ? { index: mk.index, frac: mk.frac, label: "" } : null });
    var cap = document.createElement("div"); cap.className = "legend";
    cap.innerHTML = '<span><i class="sw s1"></i>Arriba: leads · Abajo: costo por lead</span>' + (mk ? '<span><i class="sw mk"></i>' + esc(mk.legend) + '</span>' : '') + (m.partial >= 0 ? '<span><i class="sw part"></i>' + esc(m.labels[m.partial]) + ' parcial</span>' : '');
    el.appendChild(cap);
  }

  /* ---------- modelo ---------- */
  function build(D) {
    var m = { D: D, tz: D.timezone || TZ, days: [] };
    for (var d = D.period.since; d <= D.period.until; d = addDays(d, 1)) m.days.push(d);
    m.partial = D.period.until >= D.today ? m.days.length - 1 : -1;
    m.full = m.days.filter(function (_, i) { return i !== m.partial; });
    m.hasPrev = m.full.length > 0;
    m.cmp = m.hasPrev ? m.full : m.days;
    m.labels = m.days.map(function (d, i) { return dShort(d) + (i === m.partial ? "*" : ""); });
    m.rangeText = m.cmp.length > 1 ? "de " + dLong(m.cmp[0]) + " a " + dLong(m.cmp[m.cmp.length - 1]) : "el " + dLong(m.cmp[0]);

    var acts = D.activities.slice().sort(function (a, b) { return a.time < b.time ? -1 : 1; });
    acts.forEach(function (a) { a.p = parts(a.time, m.tz); });
    m.acts = acts.filter(function (a) { return a.p.date >= D.period.since && a.p.date <= D.period.until; });
    m.byCamp = {};
    m.acts.forEach(function (a) { (m.byCamp[a.campaignId || "_"] = m.byCamp[a.campaignId || "_"] || []).push(a); });

    m.rows = D.campaigns.map(function (c) {
      var get = function (day, k) { return (c.daily[day] || {})[k] || 0; };
      var r = { c: c, n: shortName(c.name) };
      r.l = m.days.map(function (d) { return get(d, "results"); });

        '<td class="bar-cell"><div class="bar-fill' + (r.stopped ? " off" : r.acts.length ? " flag" : "") + '" style="width:' + Math.max(100 * r.TL / maxL, 1).toFixed(1) + '%"></div></td>' +
        '<td class="num"><strong>' + num(r.TL, 0) + '</strong></td><td class="num">' + usd(r.TS) + '</td>' +
        '<td class="num"><span class="chip ' + b + '"><i class="dot"></i>' + (cpl === null ? "sin leads" : usd(cpl) + " · " + { good: "bajo", mid: "medio", high: "alto" }[b]) + '</span><div class="prevcpl">' + (r.pcpl ? "antes: " + usd(r.pcpl) : "sin datos previos") + '</div></td>' +
        '<td class="num">' + (r.stopped ? '<span class="prevcpl">—</span>' : r.c.budget ? usd(r.c.budget, 0) : "—") + '</td><td class="num">' + r.l.map(function (v) { return num(v, 0); }).join(" · ") + '</td></tr>';
    });
    h += '</tbody></table></div></div>';
    if (m.others.length) h += '<div class="reading"><strong>Campañas que no buscan formularios</strong><span>' + esc(listText(m.others.map(function (r) { return r.n + " (" + (r.c.kind === "reach" ? num(r.TL, 0) + " de alcance diario sumado" : r.c.kind === "traffic" ? num(r.TL, 0) + " visitas" : "sin resultado medible") + ", " + usd(r.TS) + ")"; })) + ". Su gasto no entra en los KPI.") + '</span></div>';
    return h + '</section>';
  }

  function oppsHtml(m) {
    var names = ["Alta", "Media", "Escalar"], cls = ["high", "mid", "good"];
    var h = '<section id="oportunidades"><div class="section-head"><h2>Oportunidades de mejora hasta la próxima reunión</h2><p>Se calculan con reglas fijas sobre los días completos frente a los mismos días de la semana anterior. Son señales para revisar, no un análisis redactado.</p></div><div class="card">';
    if (!m.opps.length) h += '<p>' + (m.hasPrev ? "Ninguna campaña cumple las reglas de alerta en este período." : "Hace falta al menos un día completo para calcular oportunidades.") + '</p>';
    else {
      h += '<ul class="opps">';
      m.opps.forEach(function (o) { h += '<li><span class="prio"><span class="chip ' + cls[o.p] + '"><i class="dot"></i>' + names[o.p] + '</span></span><div class="body"><strong>' + esc(o.t) + '</strong><span class="todo">' + esc(o.d) + (o.s ? ' <b>Sugerencia:</b> ' + esc(o.s) : '') + '</span></div></li>'; });
      h += '</ul>';
    }
    return h + '</div></section>';
  }

  function salesHtml(m) {
    var t = m.tot, li = [];
    li.push("<strong>Llegaron " + num(t.TL, 0) + " contactos:</strong> " + esc(listText(m.days.map(function (d, i) { return num(t.dl[i], 0) + " el " + dLong(d) + (i === m.partial ? " (parcial)" : ""); }))) + ".");
    var top = m.leads.filter(function (r) { return r.TL; }).sort(function (a, b) { return b.TL - a.TL; }).slice(0, 6);
    if (top.length) li.push("<strong>Los programas con más contactos</strong> fueron " + esc(listText(top.map(function (r) { return r.n + " (" + num(r.TL, 0) + ")"; }))) + ".");
    if (m.hasPrev) {
      var stopped = m.leads.filter(function (r) { return r.stopped; });
      if (stopped.length) li.push("<strong>Ya no entran leads de</strong> " + esc(listText(stopped.map(function (r) { return r.n; }))) + ". Los contactos anteriores siguen vigentes.");
      var less = m.leads.filter(function (r) { return !r.stopped && r.pL >= 5 && r.L <= r.pL * 0.75; }).sort(function (a, b) { return (a.L - a.pL) - (b.L - b.pL); }).slice(0, 3);
      if (less.length) li.push("<strong>Llegan menos contactos de</strong> " + esc(listText(less.map(function (r) { return r.n + " (" + num(r.L, 0) + " frente a " + num(r.pL, 0) + ")"; }))) + ".");
      var more = m.leads.filter(function (r) { return r.L >= 5 && r.L >= r.pL * 1.25 && r.pL; }).sort(function (a, b) { return (b.L - b.pL) - (a.L - a.pL); }).slice(0, 3);
      if (more.length) li.push("<strong>Suben</strong> " + esc(listText(more.map(function (r) { return r.n + " (" + num(r.L, 0) + " frente a " + num(r.pL, 0) + ")"; }))) + ".");
    }
    return '<section id="ventas"><div class="section-head"><h2>Qué significa para Ventas</h2></div><div class="card takeaways"><ul>' + li.map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ul></div></section>';
  }

  function notesHtml(m) {
    var D = m.D, t = m.tot, li = [];
    li.push("Datos leídos de la API de Meta el " + dLong(D.today) + " a las " + parts(D.generatedAt, m.tz).hm + " (hora de " + m.tz.split("/").pop().replace(/_/g, " ") + ")." + (m.partial >= 0 ? " El último día es parcial y no entra en los promedios ni en las comparaciones." : ""));
    li.push("Leads, inversión y costo por lead cuentan solo las campañas con objetivo de clientes potenciales (" + usd(t.TS) + " en el período)." + (t.other ? " Las demás campañas gastaron " + usd(t.other) + "." : ""));
    li.push("El informe se actualiza solo, cada hora de lunes a viernes entre las 08:00 y las 18:00, con un flujo programado de GitHub. Se pueden elegir fechas de los últimos 21 días.");
    li.push("La comparación usa los mismos días de la semana anterior, leídos en la misma actualización.");
    li.push("Las acciones vienen del historial de cambios de Meta: " + m.acts.length + " hechos por personas en el período" + (D.autoActivities ? "; se ocultan " + D.autoActivities + " registros automáticos (revisiones y entregas)" : "") + ".");
    li.push("Las piezas muestran la versión actual de cada anuncio; Meta no guarda cómo era antes de editarlo. De los videos se muestra una imagen fija con enlace al anuncio.");
    li.push("Las oportunidades se calculan con reglas fijas: alta si gasta sin leads, si el costo supera " + usd(BAND.mid) + " y subió 15 % o más, o si los leads cayeron 40 % o más; media si el costo supera " + usd(BAND.mid) + ", si los leads cayeron 25 % o más, si cambió el presupuesto o si se pausó una campaña barata; escalar si el costo es de " + usd(BAND.low) + " o menos con al menos 3 leads por día.");
    li.push("Costo por lead = inversión dividida entre formularios. Se miden formularios, no matrículas.");
    (D.warnings || []).forEach(function (w) { li.push("Aviso: no se pudo leer una parte de los datos (" + w + ")."); });
    return '<footer class="note"><strong>Notas sobre los datos</strong><ul>' + li.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul></footer>';
  }

  function render(D) {
    var m = build(D), t = m.tot;
    $("report").innerHTML = headerHtml(m) + summaryHtml(m) + actionsHtml(m) + rankingHtml(m) + oppsHtml(m) + salesHtml(m) + notesHtml(m);
    var n = t.n || 1, prev = m.hasPrev && t.pL;
    barChart($("ch-leads"), { values: t.dl, labels: m.labels, partial: m.partial, fmt: function (v) { return num(v, 0); }, prev: prev ? t.pL / n : null, aria: "Leads por día" });
    barChart($("ch-spend"), { values: t.ds, labels: m.labels, partial: m.partial, fmt: function (v) { return "$" + num(v, 0); }, prev: prev ? t.pS / n : null, aria: "Inversión por día" });
    barChart($("ch-cpl"), { values: t.dl.map(function (l, i) { return l ? t.ds[i] / l : null; }), labels: m.labels, partial: m.partial, fmt: function (v) { return "$" + num(v, 2); }, prev: prev ? t.pcpl : null, aria: "Costo por lead por día" });
    Array.prototype.forEach.call(document.querySelectorAll(".act-chart"), function (el) {
      var row = m.rows.filter(function (r) { return r.c.id === el.getAttribute("data-camp"); })[0];
      if (!row) return;
      var first = row.acts[0], idx = first ? m.days.indexOf(first.p.date) : -1;
      dualDay(el, m, row, idx >= 0 ? { index: idx, frac: first.p.frac, label: "Cambio", legend: "Primer cambio (" + dShort(first.p.date) + ", " + first.p.hm + ")" } : null);
    });
  }

  /* ---------- carga: los datos llegan cifrados y se abren con la clave en el navegador ---------- */
  var DATA = null;
  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

  function decrypt(box, password) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"])
      .then(function (base) { return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(box.salt), iterations: box.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); })
      .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, k, b64(box.ct)); })
      .then(function (buf) { return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); })
      .then(JSON.parse);
  }

  function unlock() {
    $("gate-error").textContent = "Abriendo el informe…";
    fetch("data.enc.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("sin-datos"); return r.json(); })
      .then(function (box) { return decrypt(box, key).catch(function () { throw new Error("clave"); }); })
      .then(function (data) {
        DATA = data; remember();
        $("gate").hidden = true; $("app").hidden = false;
        $("since").min = $("until").min = data.range.min;
        $("since").max = $("until").max = data.range.max;
        setRange(defaultRange(data.today));
        show();
      })
      .catch(function (e) {
        forget();
        showGate(e.message === "clave" ? "Clave incorrecta." : e.message === "sin-datos" ? "Todavía no hay datos publicados. Ejecuta el flujo en GitHub Actions." : "No se pudo abrir el informe en este navegador.");
      });
  }

  function show() {
    if (!DATA) return;
    var since = $("since").value, until = $("until").value, k;
    if (!since || !until) return;
    if (since > until) { k = since; since = until; until = k; }
    if (since < DATA.range.min) since = DATA.range.min;
    if (until > DATA.range.max) until = DATA.range.max;
    if (since > until) since = until;
    setRange({ since: since, until: until });
    var inRange = function (d) { return d >= since && d <= until; };
    var V = {};
    for (k in DATA) V[k] = DATA[k];
    V.period = { since: since, until: until };
    V.ads = DATA.ads.map(function (a) {
      var o = {}, f;
      for (f in a) o[f] = a[f];
      o.spend = 0; o.results = 0;
      Object.keys(a.daily || {}).forEach(function (d) { if (inRange(d)) { o.spend += a.daily[d][0]; o.results += a.daily[d][1]; } });
      return o;
    });
    V.autoActivities = Object.keys(DATA.autoByDate || {}).reduce(function (n, d) { return n + (inRange(d) ? DATA.autoByDate[d] : 0); }, 0);
    render(V);
    var tz = DATA.timezone || TZ, stale = todayTZ(tz) > DATA.today;
    $("status").className = "status" + (stale ? " error" : "");
    $("status").textContent = "Datos actualizados el " + dLong(DATA.today) + " a las " + parts(DATA.generatedAt, tz).hm + (stale ? ". Hoy todavía no se ha actualizado." : "");
  }

  function remember() { try { sessionStorage.setItem("informe-key", key); } catch (e) {} }
  function forget() { key = ""; try { sessionStorage.removeItem("informe-key"); } catch (e) {} }
  function showGate(msg) { $("app").hidden = true; $("gate").hidden = false; $("gate-error").textContent = msg || ""; $("key").value = ""; $("key").focus(); }
  function setRange(r) { $("since").value = r.since; $("until").value = r.until; }

  $("gate").addEventListener("submit", function (e) { e.preventDefault(); key = $("key").value; unlock(); });
  $("toolbar").addEventListener("submit", function (e) { e.preventDefault(); show(); });
  $("preset").addEventListener("click", function () { if (DATA) { setRange(defaultRange(DATA.today)); show(); } });
  $("print").addEventListener("click", function () { window.print(); });

  try { key = sessionStorage.getItem("informe-key") || ""; } catch (e) {}
  if (key) unlock();
})();
</script>
</body>
</html>
